name: Publish MkDocs Documentation (v1.0)

# Builds the docs from the 1.0 release branch and publishes them as version
# "1.0" using mike. No alias and not the default: 1.0 is selectable in the
# version dropdown but visitors land on the default ("latest" = 1.1). mike
# writes 1.0 into its own subdirectory of gh-pages without disturbing 1.1.

on:
  push:
    branches:
      - release/mcp-server-1.0.doc
  workflow_dispatch:

# Required so the default GITHUB_TOKEN can push to the gh-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so mike can read/update the existing gh-pages branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy 1.0
        run: mike deploy --push 1.0
