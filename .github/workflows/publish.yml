name: Publish MkDocs Documentation (v1.1 — latest)

# Builds the docs from `main` and publishes them as version "1.1" with the
# "latest" alias, using mike. mike commits each version into its own
# subdirectory of the gh-pages branch and maintains versions.json, which the
# Material theme reads to render the version selector. Version 1.0 is published
# separately from the release/mcp-server-1.0.doc branch and is preserved here
# because mike only touches the version it deploys.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required so the default GITHUB_TOKEN can push to the gh-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so mike can read/update the existing gh-pages branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy 1.1 as latest
        run: |
          # --alias-type=copy: mike's default is a symlink, which becomes a
          # 1 KB text file when gh-pages is checked out on Windows, so /latest/
          # 404s on IIS. `set-default` writes a redirect page, not an alias,
          # and does not accept this flag.
          mike deploy --push --update-aliases --alias-type=copy 1.1 latest
          mike set-default --push latest
